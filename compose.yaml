# Local or single-host launch. Copy backend/.env.production.example to backend/.env
# and set APP_KEY before `docker compose up`. Purchases stay off.
services:
  app:
    build: .
    env_file:
      - backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: social
      DB_USERNAME: social
      DB_PASSWORD: social
      APP_DEBUG: "false"
      LOG_LEVEL: error
      COMMERCE_PURCHASES: "false"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: social
      POSTGRES_USER: social
      POSTGRES_PASSWORD: social
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U social -d social"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
