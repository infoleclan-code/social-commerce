; The app does not broadcast and does not use Redis queues, so Horizon and Reverb are not required.
; schedule:work runs the scheduler in the foreground. queue:work runs IndexProductImage and
; any webhook job the database queue receives. Copy this file to the host supervisor config
; and set the directory to the deployed backend path.

[program:laravel-schedule]
command=php artisan schedule:work
directory=/workspace/backend
autostart=true
autorestart=true
stopwaitsecs=30
stdout_logfile=/var/log/laravel-schedule.log
stderr_logfile=/var/log/laravel-schedule.err.log

[program:laravel-queue]
command=php artisan queue:work --sleep=1 --tries=3 --max-time=3600
directory=/workspace/backend
autostart=true
autorestart=true
stopwaitsecs=30
stdout_logfile=/var/log/laravel-queue.log
stderr_logfile=/var/log/laravel-queue.err.log
