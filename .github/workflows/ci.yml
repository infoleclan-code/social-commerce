name: CI

on:
  push:
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          POSTGRES_DB: social_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U root -d social_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql, pgsql, mbstring, xml, curl, zip, gd, bcmath
          coverage: none
      - name: Install PHP dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Pint
        working-directory: backend
        run: vendor/bin/pint --test
      - name: PHPUnit
        working-directory: backend
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: social_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          export APP_KEY="base64:$(php -r 'echo base64_encode(random_bytes(32));')"
          php vendor/bin/phpunit --do-not-cache-result
      - name: PHPUnit with in-app purchases off
        working-directory: backend
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: social_test
          DB_USERNAME: root
          DB_PASSWORD: root
          COMMERCE_PURCHASES: "false"
        run: |
          export APP_KEY="base64:$(php -r 'echo base64_encode(random_bytes(32));')"
          php vendor/bin/phpunit --do-not-cache-result

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install and typecheck
        working-directory: mobile
        run: |
          npm ci
          npx tsc --noEmit
          npx eslint .
      - name: npm audit (report only)
        working-directory: mobile
        continue-on-error: true
        run: npm audit --audit-level=moderate
